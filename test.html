<!DOCTYPE html>
<html>
<head>
  <title>Android Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    audio {
      width: 100%;
      height: 54px;
      margin: 20px 0;
      display: block;
      background: #fff;
    }
    .test-box {
      background: #fff;
      color: #000;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }
    h1 { font-size: 1.2rem; margin-top: 30px; color: #7c5cff; }
  </style>
</head>
<body>
  <h1>TEST 1 — Simple audio src</h1>
  <audio controls src="song1.mp3"></audio>

  <h1>TEST 2 — With source tag</h1>
  <audio controls>
    <source src="song1.mp3" type="audio/mpeg">
  </audio>

  <h1>TEST 3 — External MP3</h1>
  <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <div class="test-box">
    <h3>Report what you see:</h3>
    <p>Which of the 3 players above can you SEE and PLAY?</p>
  </div>
</body>
</html>
